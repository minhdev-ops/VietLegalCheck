name: vietlegal

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-VietLegal Check}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  APP_LOCALE: ${APP_LOCALE:-vi}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-vietlegal}
  DB_USERNAME: ${DB_USERNAME:-vietlegal}
  DB_PASSWORD: ${DB_PASSWORD:-vietlegal}
  CACHE_STORE: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CLIENT: predis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: ${STORAGE_ROOT_USER:-vietlegal}
  AWS_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD:-vietlegal-secret}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${STORAGE_BUCKET:-vietlegal-docs}
  AWS_ENDPOINT: http://storage:8333
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AI_SERVICE_URL: http://ai:8100
  AI_SERVICE_KEY: ${AI_SERVICE_KEY:-dev-internal-key-change-me}
  AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
  AI_PROVIDER_KEY: ${AI_PROVIDER_KEY:-}
  AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4o-mini}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  LEGAL_ADMIN_EMAIL: ${LEGAL_ADMIN_EMAIL:-admin@vietlegal.local}
  LEGAL_ADMIN_PASSWORD: ${LEGAL_ADMIN_PASSWORD:-ChangeMe!2026}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vietlegal}
      POSTGRES_USER: ${DB_USERNAME:-vietlegal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vietlegal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vietlegal} -d ${DB_DATABASE:-vietlegal}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SRS 6.1 names MinIO. This registry mirror denies the MinIO repository, so the
  # S3-compatible object store here is SeaweedFS: same S3 API, same Laravel driver,
  # same SSE option. Swap this service back to `minio/minio` where the pull works.
  storage:
    image: chrislusf/seaweedfs:latest
    command:
      ["server", "-dir=/data", "-s3", "-s3.port=8333",
       "-s3.config=/etc/seaweed/s3.json", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweed/s3.json:ro
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build: ./services/ai
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-dev-internal-key-change-me}
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_PROVIDER_KEY: ${AI_PROVIDER_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4o-mini}
      SCAN_MAX_PAGES: ${SCAN_MAX_PAGES:-15}
      SCAN_MAX_BYTES: ${SCAN_MAX_BYTES:-3000000}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Deliberately no host ports: the service is reachable only on the internal network.

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - appstorage:/var/www/html/storage

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=280", "--queue=high,default"]
    user: www-data
    environment:
      <<: *app-env
    depends_on:
      app:
        condition: service_started
    volumes:
      - appstorage:/var/www/html/storage

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    user: www-data
    environment:
      <<: *app-env
    depends_on:
      app:
        condition: service_started
    volumes:
      - appstorage:/var/www/html/storage

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/spa:ro
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  storagedata:
  appstorage:
